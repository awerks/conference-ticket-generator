<!doctype html>
<html lang="en" ">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="./assets/images/favicon-32x32.png"
        />

        <title>Conference ticket generator</title>

        <link rel="stylesheet" href="tw.css" />
    </head>
    <body
        class="font-primary text-labels grid justify-items-center md:px-10 px-5 text-neutral-300 pb-10 min-h-screen"
    >
        <div class="max-w-2xl">
            <a href="index.html">
                <img
                class="mx-auto mt-10"
                src="assets/images/logo-full.svg"
                alt="Coding Conf Logo"
                width="200"
                height="29"
            />
            </a>
            
            <h1
                class="text-neutral-0 mt-10 text-center text-3xl md:text-5xl font-bold leading-[1.2]"
            >
                Your Journey to Coding Conf 2025 Starts Here!
            </h1>
            <p
                class="secure-message text-center text-xl mt-6 text-neutral-300/85"
            >
                Secure your spot at next year's biggest coding conference.
            </p>
            <form
                class="max-w-[30rem] mx-auto grid gap-4 mt-10"
                id="ticket-form"
            >
                <label for="upload-avatar">Upload avatar</label>

                <div
                    class="upload-container rounded-lg border border-dashed border-neutral-300 focus-within:outline-2 focus-within:outline-offset-2 focus-within:outline-neutral-300/80"
                >
                    <label
                        class="upload-avatar flex flex-col justify-center items-center p-4 text-center"
                        for="file-input"
                        id="upload-label"
                    >
                        <img
                            class="size-12 mx-auto p-2 bg-neutral-500/20 rounded-xl outline-neutral-300/20 outline pointer-events-none"
                            src="./assets/images/icon-upload.svg"
                            alt=""
                            id="upload-icon"
                            aria-hidden="true"
                        />
                        <input
                            type="file"
                            class="sr-only"
                            id="file-input"
                            name="avatar"
                            accept="image/*"
                        />
                        <p
                            class="drag-text mt-2 pointer-events-none text-lg text-neutral-300/80"
                        >
                            Drag and drop or click to upload
                        </p>
                    </label>

                    <div
                        class="image-preview bg-neutral-700/30 p-4 hidden flex-col items-center"
                        id="image-preview-area"
                    >
                        <img
                            class="size-12 mx-auto rounded-xl object-cover mb-4 outline outline-neutral-300/70"
                            src=""
                            alt="Avatar preview"
                            id="preview-image"
                        />
                        <div class="flex gap-4" id="remove-change-btns">
                            <button
                                type="button"
                                class="bg-neutral-0/10 py-1 px-2 rounded-sm text-sm text-neutral-300/80 hover:underline hover:underline-offset-2 hover:bg-neutral-0/20 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-neutral-300/80 cursor-pointer transition-colors"
                                id="remove-btn"
                            >
                                Remove image
                            </button>
                            <button
                                type="button"
                                class="bg-neutral-0/10 py-1 px-2 rounded-sm text-sm text-neutral-300/80 hover:underline hover:underline-offset-2 hover:bg-neutral-0/20 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-neutral-300/80 cursor-pointer transition-colors"
                                id="change-btn"
                            >
                                Change image
                            </button>
                        </div>
                    </div>
                </div>

                <p
                    class="text-sm text-neutral-500 inline-flex gap-2 items-center"
                    id="input-info"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="16"
                        height="16"
                        viewBox="0 0 16 16"
                    >
                        <path
                            stroke="currentColor"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M2 8a6 6 0 1 0 12 0A6 6 0 0 0 2 8Z"
                        />
                        <path
                            fill="currentColor"
                            d="M8.004 10.462V7.596ZM8 5.57v-.042Z"
                        />
                        <path
                            stroke="currentColor"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M8.004 10.462V7.596M8 5.569v-.042"
                        />
                    </svg>
                    Upload your photo (JPG or PNG, max size: 500KB).
                </p>
                <label for="full-name">Full Name</label>
                <input
                    class="input"
                    name="full-name"
                    type="text"
                    max="30"
                    id="full-name"
                />
                <label for="email">Email Address</label>
                <input
                    class="input"
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@email.com"
                    max="30"
                    required
                />
                <p
                    id="email-error"
                    class="hidden text-sm text-red-400 gap-2 items-center"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="16"
                        height="16"
                        viewBox="0 0 16 16"
                    >
                        <path
                            stroke="currentColor"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M2 8a6 6 0 1 0 12 0A6 6 0 0 0 2 8Z"
                        />
                        <path
                            fill="currentColor"
                            d="M8.004 10.462V7.596ZM8 5.57v-.042Z"
                        />
                        <path
                            stroke="currentColor"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M8.004 10.462V7.596M8 5.569v-.042"
                        />
                    </svg>
                    Please enter a valid email address.
                </p>
                <label for="github-username">GitHub Username</label>
                <input
                    class="input"
                    name="github-username"
                    type="text"
                    max="30"
                    id="github-username"
                    placeholder="@yourusername"
                />
                <button class="btn mt-2" type="submit">
                    Generate My ticket
                </button>
            </form>

            <div
                class="hidden ticket outline outline-neutral-300/70 opacity bg-neutral-300/15 grid-cols-[1fr_auto] rounded-lg mt-20 max-w-[30rem] mx-auto"
            >
                <div class="ticket__body p-4">
                    <div class="ticket__header">
                        <div class="flex gap-4 items-start">
                            <img
                                class="self-stretch"
                                src="assets/images/logo-mark.svg"
                                alt="Ticket Header"
                                height="40"
                                width="40"
                            />

                            <p class="text-2xl text-neutral-0 font-bold">
                                Coding Conf
                                <span class="block text-sm text-neutral-300/60"
                                    >Jan 31, 2025 / Austin, TX</span
                                >
                            </p>
                        </div>
                    </div>
                    <div class="ticket__content mt-10 flex gap-4">
                        <img
                            class="size-15 rounded-md"
                            src="assets/images/image-avatar.jpg"
                            alt="Avatar"
                            id="ticket-avatar"
                            height="15"
                            width="15"
                            class="avatar"
                        />
                        <div>
                            <h2
                                id="ticket-name"
                                class="ticket__name text-neutral-0 text-xl font-bold"
                            >
                                Jonatan Kristof
                            </h2>
                            <p class="ticket__github" id="ticket-github">
                                <img
                                    class="inline-block -mr-1"
                                    src="assets/images/icon-github.svg"
                                    alt="Github"
                                    width="22"
                                    height="23"
                                />
                                @jonatankristof0101
                            </p>
                        </div>
                    </div>
                </div>
                <div
                    class="ticket__number grid place-content-center border-dashed border-l-2"
                >
                    <span class="sr-only">Ticket number</span>
                    <p
                        class="ticket__number-value text-neutral-300/70 font-bold text-2xl rotate-90"
                    >
                        #01609
                    </p>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
